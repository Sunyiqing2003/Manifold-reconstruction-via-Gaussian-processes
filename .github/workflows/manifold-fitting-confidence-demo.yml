name: manifold-fitting-confidence-demo

on:
  push:
    branches:
      - "demo/manifold-fitting-confidence-band"
    paths:
      - "experiments/manifold_fitting_confidence_demo.py"
      - "experiments/manifold_fitting_gp_confidence_demo.py"
      - "experiments/plot_manifold_fitting_gp_tube.py"
      - "experiments/manifold_fitting_gp_mfcenter_demo.py"
      - "experiments/notes_gp_contraction_demo.py"
      - "experiments/benchmark_mf_gp_uq_vs_mrgap.py"
      - "experiments/manifold_fitting_frequentist_uq.py"
      - "benchmark/manifold_benchmark.py"
      - ".github/workflows/manifold-fitting-confidence-demo.yml"
  pull_request:
    paths:
      - "experiments/manifold_fitting_confidence_demo.py"
      - "experiments/manifold_fitting_gp_confidence_demo.py"
      - "experiments/plot_manifold_fitting_gp_tube.py"
      - "experiments/manifold_fitting_gp_mfcenter_demo.py"
      - "experiments/notes_gp_contraction_demo.py"
      - "experiments/benchmark_mf_gp_uq_vs_mrgap.py"
      - "experiments/manifold_fitting_frequentist_uq.py"
      - "benchmark/manifold_benchmark.py"
      - ".github/workflows/manifold-fitting-confidence-demo.yml"
  workflow_dispatch:

jobs:
  quick-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy scipy matplotlib
      - name: Run quick weighted-mean confidence demo
        run: python experiments/manifold_fitting_confidence_demo.py --quick
      - name: Run targeted bias-dominated weighted-mean scan
        run: >-
          python experiments/manifold_fitting_confidence_demo.py
          --pilot-modes oracle
          --n 8000
          --sigmas 0.08
          --h-factors 1.5
          --mc-reps 20
          --bootstrap 150
          --population-n 60000
          --grid-size 120
          --dense-grid-size 1600
          --output results/manifold_fitting_confidence_demo_highn
      - name: Run quick GP-variance confidence demo
        run: python experiments/manifold_fitting_gp_confidence_demo.py --quick
      - name: Run moderate oracle GP-variance scan
        run: >-
          python experiments/manifold_fitting_gp_confidence_demo.py
          --pilot-modes oracle
          --n 2500
          --sigmas 0.06
          --h-factors 1.5
          --mc-reps 10
          --grid-size 48
          --dense-grid-size 1200
          --max-points 120
          --population-n 1800
          --population-repeats 4
          --output results/manifold_fitting_gp_confidence_demo_oracle
      - name: Plot GP tube inside observation-noise band
        run: >-
          python experiments/plot_manifold_fitting_gp_tube.py
          --pilot-mode data
          --n 3000
          --sigma 0.06
          --h-factor 1.5
          --grid-size 60
          --dense-grid-size 2400
          --noise-multiplier 1.96
          --output results/manifold_fitting_gp_tube_visualization
      - name: Compare MF center with GP-refined center and build MF-centered GP tube
        run: >-
          python experiments/manifold_fitting_gp_mfcenter_demo.py
          --n 3000
          --sigma 0.06
          --h-factor 1.5
          --grid-size 60
          --dense-grid-size 2400
          --mc-reps 20
          --noise-multiplier 1.96
          --output results/manifold_fitting_gp_mfcenter_demo
      - name: Run notes-faithful Yao-cylinder GP contraction experiment
        run: >-
          python experiments/notes_gp_contraction_demo.py
          --n 3000
          --sigma 0.06
          --mc-reps 20
          --grid-size 60
          --dense-grid-size 2400
          --c-offset 1
          --c-ell 1
          --amplitude-factor 1
          --output results/notes_gp_contraction_demo
      - name: Run moderate MF-GP-UQ versus MrGap benchmark
        run: >-
          python experiments/benchmark_mf_gp_uq_vs_mrgap.py
          --geometries circle ellipse
          --n-values 3000
          --sigma-values 0.06
          --repeats 20
          --curve-grid-size 60
          --truth-size 4800
          --ablation-reps 20
          --output results/benchmark_mf_gp_uq_vs_mrgap
      - name: Run exact-MF frequentist UQ diagnostic
        run: >-
          python experiments/manifold_fitting_frequentist_uq.py
          --n 3000
          --sigma 0.06
          --mc-reps 20
          --bootstrap 40
          --bootstrap-datasets 1
          --truth-size 4800
          --output results/manifold_fitting_frequentist_uq
      - name: Upload demo results
        uses: actions/upload-artifact@v4
        with:
          name: manifold-fitting-confidence-demo
          path: |
            results/manifold_fitting_confidence_demo/
            results/manifold_fitting_confidence_demo_highn/
            results/manifold_fitting_gp_confidence_demo/
            results/manifold_fitting_gp_confidence_demo_oracle/
            results/manifold_fitting_gp_tube_visualization/
            results/manifold_fitting_gp_mfcenter_demo/
            results/notes_gp_contraction_demo/
            results/benchmark_mf_gp_uq_vs_mrgap/
            results/manifold_fitting_frequentist_uq/
          if-no-files-found: error
